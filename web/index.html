<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open TablePlus</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside>
    <div class="row">
      <select id="conn" aria-label="Connection"></select>
      <button id="editConn" title="Edit connection" aria-label="Edit connection">✎</button>
      <button id="newConn" title="New connection" aria-label="New connection">+</button>
    </div>
    <span id="env" hidden></span>
    <select id="db" aria-label="Database"></select>
    <input id="filterTables" type="search" placeholder="Filter tables…" aria-label="Filter tables">
    <p id="sideMsg" class="err" role="status" hidden></p>
    <nav id="tree" aria-label="Tables"></nav>
    <button id="sqlBtn" class="wide">SQL query</button>
  </aside>

  <main>
    <nav id="tabs" role="tablist" aria-label="Open tabs"></nav>
    <div id="panes">
      <p id="empty">Pick a table on the left to open it in a tab, or open a SQL query.</p>
    </div>
  </main>

  <dialog id="connDlg">
    <form id="connForm" method="dialog">
      <h2>Connection</h2>
      <label>Name <input name="name" required></label>
      <label>Host <input name="host" required value="127.0.0.1"></label>
      <label>Port <input name="port" type="number" min="1" max="65535" value="5432"></label>
      <label>User <input name="user" autocomplete="off"></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" placeholder="blank = keep saved / use ~/.pgpass"></label>
      <label>Database <input name="database" value="postgres"></label>
      <label>SSL mode
        <select name="sslmode">
          <option>prefer</option><option>disable</option><option>require</option><option>verify-full</option>
        </select>
      </label>
      <label>Environment
        <select name="env">
          <option value="">none</option><option>dev</option><option>staging</option><option>prod</option>
        </select>
      </label>
      <p id="dlgMsg" role="status"></p>
      <div class="row">
        <button type="button" id="dlgTest">Test</button>
        <button type="button" id="dlgDelete" class="danger">Delete</button>
        <span class="grow"></span>
        <button value="cancel" formnovalidate>Close</button>
        <button type="button" id="dlgSave" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <iframe name="dl" id="dl" hidden></iframe>
  <script src="app.js"></script>
</body>
</html>
